<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Telegram Login</title>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #0f1115;
        color: #ffffff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        box-sizing: border-box;
      }
      .card {
        width: 420px;
        max-width: 100%;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 8px 0;
      }
      .sub {
        font-size: 13px;
        opacity: 0.85;
        margin: 0 0 14px 0;
        line-height: 1.35;
      }
      #tg-btn {
        display: flex;
        justify-content: center;
        min-height: 44px;
        padding: 8px 0 0 0;
      }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        opacity: 0.75;
        line-height: 1.35;
      }
    </style>

    <script>
      // ⚠️ username бота (без @)
      const TG_BOT_USERNAME = "nlevel_detailing_bot";
      // ⚠️ URL Cloud Function, которая возвращает custom token
      const TG_FUNCTION_URL = "https://us-central1-nlevel-detailing.cloudfunctions.net/telegramAuth";

      function renderTelegramButton() {
        const host = document.getElementById("tg-btn");
        if (!host) return;

        host.innerHTML = "";

        const s = document.createElement("script");
        s.async = true;
        s.src = "https://telegram.org/js/telegram-widget.js?22";
        s.setAttribute("data-telegram-login", TG_BOT_USERNAME);
        s.setAttribute("data-size", "large");
        s.setAttribute("data-radius", "10");
        s.setAttribute("data-request-access", "write");
        s.setAttribute("data-onauth", "onTelegramAuth(user)");
        host.appendChild(s);
      }

      async function onTelegramAuth(user) {
        try {
          const resp = await fetch(TG_FUNCTION_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ telegram: user })
          });

          const data = await resp.json();

          if (!resp.ok) {
            TelegramAuth.postMessage(JSON.stringify({
              type: "TG_ERROR",
              error: (data && data.error) ? data.error : ("HTTP " + resp.status)
            }));
            return;
          }

          TelegramAuth.postMessage(JSON.stringify({
            type: "TG_CUSTOM_TOKEN",
            token: data.token
          }));
        } catch (e) {
          TelegramAuth.postMessage(JSON.stringify({
            type: "TG_ERROR",
            error: "Telegram auth error"
          }));
        }
      }

      window.addEventListener("load", () => renderTelegramButton());
    </script>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <div class="title">Вход через Telegram</div>
        <div class="sub">Нажми кнопку ниже и подтверди вход.</div>
        <div id="tg-btn"></div>
        <div class="hint">Если Telegram не открывается — проверь интернет/VPN и блокировщики.</div>
      </div>
    </div>
  </body>
</html>
