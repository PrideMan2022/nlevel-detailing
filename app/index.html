<!DOCTYPE html>
<html>
<head>
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NLeveL - Детейлинг и Автомойка">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NLeveL">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>NLeveL - Детейлинг и Автомойка</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Centered reCAPTCHA overlay (enabled only during phone login) */
    body.nlevel-recaptcha-active #nlevel-recaptcha-overlay {
      display: flex;
    }

    #nlevel-recaptcha-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #nlevel-recaptcha-card {
      width: min(420px, 92vw);
      border-radius: 18px;
      background: rgba(24, 26, 31, 0.92);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      padding: 14px;
    }

    #nlevel-recaptcha-title {
      font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      color: rgba(255,255,255,0.92);
      font-size: 14px;
      margin: 0 0 10px 0;
      opacity: 0.9;
    }

    /* IMPORTANT: container must be visible for Firebase to render */
    #recaptcha-container {
      width: 100%;
      display: block;
    }

    /* Badge: hide everywhere except during login */
    .grecaptcha-badge {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(0.8);
      transform-origin: 100% 100%;
      z-index: 1 !important;
    }
    body.nlevel-recaptcha-active .grecaptcha-badge {
      opacity: 0.18 !important;
    }

    @media (max-width: 420px) {
      #nlevel-recaptcha-card { width: 94vw; }
    }
  </style>

  <script>
    // Called from Flutter (web only) to show/hide reCAPTCHA UI.
    window.nlevelSetRecaptchaActive = function(active) {
      try {
        if (active) {
          document.body.classList.add('nlevel-recaptcha-active');
        } else {
          document.body.classList.remove('nlevel-recaptcha-active');
          // Clean the container so overlay disappears immediately after verify
          var c = document.getElementById('recaptcha-container');
          if (c) c.innerHTML = '';
        }
      } catch (e) {
        // no-op
      }
    };
  </script>
</head>
<body>
  <!-- Telegram Login Overlay (NLeveL) -->
  <div id="tg-overlay" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.65); backdrop-filter: blur(6px);">
    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px;">
      <div style="width:min(420px, 100%); background: rgba(20,22,28,0.92); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:18px 16px 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.45);">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px;">
          <div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size:16px; font-weight:700; color:#fff;">
            Войти через Telegram
          </div>
          <button id="tg-close" type="button" style="appearance:none; border:none; background:transparent; color:rgba(255,255,255,0.7); font-size:22px; line-height:22px; cursor:pointer;">×</button>
        </div>
        <div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size:13px; color:rgba(255,255,255,0.72); margin-bottom:12px;">
          Нажмите кнопку ниже и подтвердите вход. Если Telegram не открывается — проверьте интернет/VPN и блокировщики.
        </div>
        <div id="tg-btn" style="display:flex; justify-content:center;"></div>
        <div id="tg-err" style="display:none; margin-top:10px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size:12px; color:#ff6b6b;"></div>
      </div>
    </div>
  </div>

  <!-- Centered overlay used only during phone login -->
  <div id="nlevel-recaptcha-overlay" aria-hidden="true">
    <div id="nlevel-recaptcha-card">
      <div id="nlevel-recaptcha-title">Подтвердите, что вы не робот</div>
      <div id="recaptcha-container"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <!-- Регистрация собственного Service Worker для PWA-кэширования ассетов Flutter. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .catch(function (e) { console.warn('[NLeveL SW]', e); });
      });
    }
  </script>

<script>
(function(){
  // Telegram Login Widget config
  const TG_BOT_USERNAME = "nlevel_detailing_bot"; // without @
  const TG_FUNCTION_URL = "https://us-central1-nlevel-detailing.cloudfunctions.net/telegramAuth";

  const overlay = () => document.getElementById('tg-overlay');
  const errBox = () => document.getElementById('tg-err');
  const btnHost = () => document.getElementById('tg-btn');

  function setError(msg){
    const el = errBox();
    if (!el) return;
    if (!msg) { el.style.display='none'; el.textContent=''; return; }
    el.style.display='block';
    el.textContent=String(msg);
  }

  function showOverlay(show){
    const el = overlay();
    if (!el) return;
    el.style.display = show ? 'block' : 'none';
    if (!show) setError(null);
    if (show) renderTelegramButton();
  }

  function clearButton(){
    const host = btnHost();
    if (!host) return;
    host.innerHTML = '';
  }

  function renderTelegramButton(){
    clearButton();
    const host = btnHost();
    if (!host) return;

    const s = document.createElement('script');
    s.async = true;
    s.src = "https://telegram.org/js/telegram-widget.js?22";
    s.setAttribute("data-telegram-login", TG_BOT_USERNAME);
    s.setAttribute("data-size", "large");
    s.setAttribute("data-radius", "10");
    s.setAttribute("data-request-access", "write");
    s.setAttribute("data-onauth", "onTelegramAuth(user)");
    host.appendChild(s);
  }

  async function onTelegramAuth(user){
    try{
      setError(null);
      const resp = await fetch(TG_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram: user })
      });
      const data = await resp.json().catch(()=> ({}));
      if (!resp.ok || !data || !data.token){
        const msg = (data && (data.error || data.message)) ? (data.error || data.message) : ("HTTP " + resp.status);
        setError("Ошибка Telegram входа: " + msg);
        // notify Flutter (optional)
        window.postMessage({ type: "TG_ERROR", error: msg }, "*");
        return;
      }
      // send token to Flutter
      window.postMessage({ type: "TG_CUSTOM_TOKEN", token: data.token }, "*");
      showOverlay(false);
    }catch(e){
      setError("Ошибка Telegram входа. Проверьте интернет/VPN и блокировщики.");
      window.postMessage({ type: "TG_ERROR", error: "telegram_auth_error" }, "*");
    }
  }

  // Expose for Telegram widget callback
  window.onTelegramAuth = onTelegramAuth;

  window.addEventListener('message', function(event){
    const d = event.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'SHOW_TG_LOGIN'){
      showOverlay(Boolean(d.show));
    }
  });

  window.addEventListener('load', function(){
    const closeBtn = document.getElementById('tg-close');
    if (closeBtn){
      closeBtn.addEventListener('click', function(){
        showOverlay(false);
      });
    }
  });
})();
</script>

</body>
</html>
